name: Main

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 8,20 * * *"

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    uses: swiftlang/github-workflows/.github/workflows/package_test.yml@0.0.19
    with:
      # Linux only, on current-2, current-1, current, nightly-release and nightly-main (the default version list).
      # The strict flags apply to the tests only; the release builds take none, as before.
      linux_command: |
        Debug-Test: swift test --explicit-target-dependency-import-check error -Xswiftc -require-explicit-sendable
        Release-Build: swift build -c release
      enable_macos: false
      enable_macos_swiftly: false
      enable_windows: false
      enable_linux_static_sdk_build: false
      enable_wasm_sdk_build: false
      enable_embedded_wasm_sdk_build: false
      enable_android_sdk_build: false
      enable_freebsd: false
      # The Cxx interop check runs on PRs only, as before.
      enable_cxx_interop: false
